# Values for the standalone agent stack.
#
# Deployed in the `agent` namespace as release `abcp-agent-s2`. Its metadata DB
# is Postgres (no sqlite, no /data volume). Agent-stack objects use the CANONICAL
# names (`standalone-agent`, `worker`, `worker-extension`, ...).
#
# It consumes the SAME shared infrastructure as the default stack (`worker`
# namespace, owned by easy-vcs/deploy) but with its OWN account / bucket /
# database so the two stacks never collide on the shared NATS/S3/Postgres.
# Selenium is self-deployed by this chart (the `s2-`-prefixed Service).
#
#   helm install abcp-agent-s2 ./charts/platform -n agent -f ./charts/platform/values-standalone2.yaml
namespaceOverride: agent
namePrefix: ""

infra:
  nats:
    host: "nats.worker.svc.cluster.local"
    port: 4222
    user: "abcp-agent-s2"       # requested account (provided by easy-vcs/deploy)
    password: "REPLACE_ME"      # provided by easy-vcs/deploy
  s3:
    bucket: "abcp-agent-s2"     # requested bucket (provided by easy-vcs/deploy)
    region: "garage"
    endpoint: "http://garage.worker.svc.cluster.local:80"
    accessKey: "REPLACE_ME"     # provided by easy-vcs/deploy
    secretKey: "REPLACE_ME"     # provided by easy-vcs/deploy
    pathStyle: true
    prefix: "abcp"
  proxy:
    http: "http://mihomo.develop.svc.cluster.local:7890"
    https: "http://mihomo.develop.svc.cluster.local:7890"

# Selenium is self-deployed by this chart (NOT shared). `s2-` prefix so it does
# not clash with the default stack's Selenium in the same namespace.
selenium:
  enabled: true
  image: docker.io/selenium/standalone-chrome:4.49.0
  port: 4444
  service:
    name: s2-selenium
  url: ""
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }

agent:
  image:
    repository: git.agent.svc.cluster.local/abcp/agent
    tag: "20261001095724"
    pullPolicy: IfNotPresent
  # Plain HTTP/1.1 liveness/readiness port (separate from the h2c RPC port).
  healthPort: 8081
  port: 8080
  service:
    name: abcp-agent
    type: ClusterIP
  corsOrigin: "*"
  disabledTools: ""
  auth:
    adminToken: "dev-admin-token"
    bootstrapTenant: "default"
    bootstrapToken: "devtenanttoken"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }
  # Postgres metadata backend — no sqlite, no /data volume.
  db:
    backend: pg
    postgres:
      host: "postgres.worker.svc.cluster.local"
      port: 80
      user: "root"
      password: "devpassword"
      database: "abcp_agent_s2" # requested DB (provided by easy-vcs/deploy)

webui:
  image:
    repository: git.agent.svc.cluster.local/abcp/agent-webui
    tag: "20260929162000"
    pullPolicy: IfNotPresent
  port: 8080
  deployment:
    name: abcp-webui
  service:
    name: abcp-webui
    type: ClusterIP
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

playwright:
  enabled: true
  image:
    repository: git.agent.svc.cluster.local/abcp/playwright-extension
    tag: "20260922031821"
    pullPolicy: IfNotPresent
  seedTenant: "*"
  viewport: "1280x720"
  idleTimeoutMs: 600000
  maxContexts: 8
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

bundled:
  seedTenant: "*"
  model:
    text: "gateway-text/tal-coding/deepseek-v4.1-flash"
    image: "gateway-image/tal-coding-gptimage/gpt-image-2.5-flare"
    imageEdit: "gateway-image/tal-coding-gptimage/gpt-image-2.5-flare"
    speech: "gateway-speech/mlops-tts-customvoice/qwen3-tts-customvoice"
    speechClone: "gateway-speech/mlops-tts-base/qwen3-tts-base"
    transcription: "gateway-transcription/mlops-asr/qwen3-asr"

# Fixed easyworker sandbox (its own, prefixed). Stays sqlite + emptyDir: it is
# an ephemeral sandbox, not a long-lived service.
worker:
  enabled: true
  image:
    repository: git.agent.svc.cluster.local/abcp/agent-worker
    tag: "20260924170523"
    pullPolicy: IfNotPresent
  service:
    name: worker
    type: ClusterIP
  port: 48080
  workspace: ""
  token: "devworker-token"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }

# Worker extension: run commands / read-write files (worker-*) AND drive a
# native GUI through the accessibility tree (computer-*) in the SAME
# config-registered sandboxes. `default` is this stack's own code sandbox; the
# three GUI workers (linux / macOS / Windows) are the standalone manifests under
# `worker-k8s/`, deployed into the `worker` namespace. The computer-* tools need
# the accessibility CLI, which only the GUI workers ship.
workerExtension:
  enabled: true
  image:
    repository: git.agent.svc.cluster.local/abcp/worker-extension
    tag: "20260929143000"
    pullPolicy: IfNotPresent
  seedTenant: "*"
  sandboxes: >-
    [{"name":"default","url":"http://worker.agent.svc.cluster.local:80","token":"devworker-token"},
     {"name":"linux","url":"http://agent-worker-desktop.worker.svc.cluster.local:80","token":"devdesktop-token"},
     {"name":"macos","url":"http://agent-worker-macos.worker.svc.cluster.local:80","token":"devmac-token"},
     {"name":"windows","url":"http://agent-worker-windows.worker.svc.cluster.local:80","token":"devwin-token"}]
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# ---- model registry (seeded create-if-absent per tenant) ----
# The standalone agent ships with NO providers; sessions need a
# `provider_id/model_id`, so seed the platform gateway providers. A tenant that
# already has providers is left untouched (a UI edit always wins).
#
# The gateway API key is NOT committed: pass it at install time
# (`--set providerApiKey=...`); it is injected into every provider below.
providerApiKey: "REPLACE_ME"
providers:
  - tenant: "*"
    providerId: gateway-text
    capability: text
    apiType: vercel-compatible-gateway
    baseUrl: https://api-gray.xueersi.com/ai-multimodal-gateway/v4/ai
    models:
      - { id: tal-coding/deepseek-v4.1-flash, name: DeepSeek V4.1 Flash, contextLimit: 1000000 }
      - { id: tal-coding/glm-5.3, name: GLM 5.3, contextLimit: 1000000 }
      - { id: tal-coding/glm-5.3-flash, name: GLM 5.3 Flash, contextLimit: 1000000 }
  - tenant: "*"
    providerId: gateway-image
    capability: image
    apiType: vercel-compatible-gateway
    baseUrl: https://api-gray.xueersi.com/ai-multimodal-gateway/v4/ai
    models:
      - { id: tal-coding-gptimage/gpt-image-2, name: GPT Image 2, contextLimit: 0 }
      - { id: tal-coding-gptimage/gpt-image-2.5-flare, name: GPT Image 2.5 Flare, contextLimit: 0 }
      - { id: tal-coding-gptimage/gpt-image-2.5-sunburst, name: GPT Image 2.5 Sunburst, contextLimit: 0 }
  - tenant: "*"
    providerId: gateway-speech
    capability: speech
    apiType: vercel-compatible-gateway
    baseUrl: https://api-gray.xueersi.com/ai-multimodal-gateway/v4/ai
    models:
      - { id: mlops-tts-customvoice/qwen3-tts-customvoice, name: Qwen3 TTS CustomVoice, contextLimit: 0 }
      - { id: mlops-tts-base/qwen3-tts-base, name: Qwen3 TTS Base, contextLimit: 0 }
  - tenant: "*"
    providerId: gateway-transcription
    capability: transcription
    apiType: vercel-compatible-gateway
    baseUrl: https://api-gray.xueersi.com/ai-multimodal-gateway/v4/ai
    models:
      - { id: mlops-asr/qwen3-asr, name: Qwen3 ASR, contextLimit: 0 }
  - tenant: "*"
    providerId: gateway-embedding
    capability: embedding
    apiType: vercel-compatible-gateway
    baseUrl: https://api-gray.xueersi.com/ai-multimodal-gateway/v4/ai
    models:
      - { id: mlops-embed/gte-multilingual-base, name: GTE Multilingual, contextLimit: 0 }
  - tenant: "*"
    providerId: gateway-rerank
    capability: rerank
    apiType: vercel-compatible-gateway
    baseUrl: https://api-gray.xueersi.com/ai-multimodal-gateway/v4/ai
    models:
      - { id: mlops-rerank/gte-multilingual-reranker-base, name: GTE Reranker, contextLimit: 0 }
  - tenant: "*"
    providerId: gateway-realtime
    capability: realtime
    apiType: vercel-compatible-gateway
    baseUrl: https://api-gray.xueersi.com/ai-multimodal-gateway/v4/ai
    models:
      - { id: mlops-voxtral/voxtral-realtime, name: Voxtral Realtime, contextLimit: 0 }

# pg mode: no /data volume at all.
persistence:
  enabled: false
  mode: pvc
  storageClass: workspace-local
  size: 2Gi

serviceAccount:
  create: false
  name: "abcp-agent"
