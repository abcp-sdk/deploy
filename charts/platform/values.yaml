# Values for the standalone ABCP agent stack.
#
# This chart is AGENT-SIDE ONLY. It deploys the agent and its extensions and
# consumes the SHARED infrastructure deployed by `easy-vcs/deploy` in the
# `worker` namespace (NATS / Garage S3 / Postgres) purely over Service DNS. The
# ONE infra component it does NOT share — Selenium (the WebDriver the playwright
# extension drives) — is deployed by this chart itself (see `selenium` below).
# There is no Forgejo and no buildkitd: the standalone agent needs neither.
#
# Topology (namespace `agent`):
#   - `standalone-agent` Pod: agent (h2c) + in-process bundled extension.
#   - `agent` Pod: Caddy aggregator (h1) serving the webui and reverse-proxying
#     `/agent.v1.*` to the agent over h2c (same-origin browser API).
#   - `playwright-extension` Pod: browser tool server (drives the in-chart Selenium).
#   - `selenium` Pod: Selenium WebDriver this chart deploys.
#   - `worker` Pod: a fixed easyworker sandbox the `worker-extension` drives.
#   - `worker-extension` Pod: run commands / read-write files in that worker.

namespaceOverride: ""

# Object-name prefix so a SECOND agent stack can coexist in the SAME namespace
# (the `agent` namespace) with distinct object names, e.g. `s2-`. Empty = the
# original names (`standalone-agent`, `worker`, ...). The Service names below
# must ALSO be prefixed in the values file.
namePrefix: ""

# ---- SHARED infrastructure endpoints (`worker` namespace, owned by easy-vcs/deploy) ----
# All references are in-cluster Service DNS. The account / bucket / database
# names below are REQUESTED from `easy-vcs/deploy` and MUST be distinct from
# every other stack on the shared services (see README).
infra:
  # Shared NATS (JetStream). ABCP's OWN account, so it does not collide with
  # another agent on `abc.discover` / `abc-presence` / ABC_MAILBOX|EVENTS|DLQ.
  nats:
    host: "nats.worker.svc.cluster.local"
    port: 4222
    user: "abcp-agent"          # requested account (provided by easy-vcs/deploy)
    password: "REPLACE_ME"      # provided by easy-vcs/deploy
  # Shared Garage S3 (durable file bytes). In-cluster plain HTTP.
  s3:
    bucket: "abcp-agent"        # requested bucket (provided by easy-vcs/deploy)
    region: "garage"
    endpoint: "http://garage.worker.svc.cluster.local:80"
    accessKey: "REPLACE_ME"     # provided by easy-vcs/deploy
    secretKey: "REPLACE_ME"     # provided by easy-vcs/deploy
    pathStyle: true
    prefix: "abcp"
  # Outbound HTTP(S) proxy. The agent loads the bundled web-fetch / brave-search
  # tools IN-PROCESS, so its Node fetch must egress through this proxy
  # (NODE_USE_ENV_PROXY=1 makes Node honor it).
  proxy:
    http: "http://mihomo.develop.svc.cluster.local:7890"
    https: "http://mihomo.develop.svc.cluster.local:7890"

# ---- Selenium WebDriver (self-deployed; NOT part of the shared infra) ----
# The playwright extension drives this node over CDP. `url` overrides the
# in-chart Service address if you point at an external Selenium instead.
selenium:
  enabled: true
  image: docker.io/selenium/standalone-chrome:4.49.0
  port: 4444
  service:
    name: selenium
  url: ""
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }

# Optional model-registry seed (AGENT_PROVIDER_SEED). JSON array of providers;
# seeded into any tenant that has NO providers yet (create-if-absent). Leave
# empty to configure providers via the UI / AdminService.
providers: ""

# ---- agent (h2c) ----
agent:
  image:
    repository: git.agent.svc.cluster.local/abcp/agent
    tag: "20261001095724"
    pullPolicy: IfNotPresent
  # Plain HTTP/1.1 liveness/readiness port (separate from the h2c RPC port).
  healthPort: 8081
  port: 8080
  service:
    # In-cluster h2c endpoint. The edge maps the public `standalone-agent` host
    # here; extensions/other backends dial it over h2c directly.
    name: standalone-agent
    type: ClusterIP
  corsOrigin: "*"
  # Tools the host hard-disables for every session.
  disabledTools: ""
  # Idle-turn watchdog: re-trigger a session whose tip is an assistant step
  # ending on a `tool_result` (the model ran a tool then stopped) by publishing
  # a `system:idlewatch` mailbox trigger. Interval is a Go-style duration
  # (e.g. "2m", "120s"). Enabled by default.
  idlewatch:
    enabled: true
    interval: "2m"
  # Bearer-token auth. `required`, with a static admin token + a bootstrapped
  # first tenant (token -> tenant).
  auth:
    adminToken: "dev-admin-token"
    bootstrapTenant: "default"
    bootstrapToken: "devtenanttoken"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }
  # Metadata backend. `pg` uses the SHARED Postgres in the `worker` namespace
  # (no /data volume). `sqlite` keeps the DB under /data (needs the persistence
  # volume) — only for a fully self-contained deployment.
  db:
    backend: pg
    postgres:
      host: "postgres.worker.svc.cluster.local"
      port: 80
      user: "root"
      password: "devpassword"
      database: "abcp_agent"   # requested DB (provided by easy-vcs/deploy)

# ---- webui + Caddy aggregator (h1) ----
webui:
  image:
    # Caddy with the webui static build baked into /srv.
    repository: git.agent.svc.cluster.local/abcp/agent-webui
    tag: "20260928140031"
    pullPolicy: IfNotPresent
  port: 8080
  service:
    name: agent
    type: ClusterIP
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# ---- playwright browser-automation extension (separate server) ----
playwright:
  enabled: true
  image:
    repository: git.agent.svc.cluster.local/abcp/playwright-extension
    tag: "20260922031821"
    pullPolicy: IfNotPresent
  # Tenant the default is seeded for. `"*"` (default) seeds EVERY known tenant.
  seedTenant: "*"
  viewport: "1280x720"
  idleTimeoutMs: 600000
  maxContexts: 8
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# ---- bundled extension (in-process) model knobs ----
# Seeded into the `cfg` KV (create-if-absent; a UI-set value always wins) so
# image/speech/transcription tools work out of the box. Refs are canonical
# `provider_id/model_id` on the shared gateway. There is NO `video` default:
# the gray gateway serves no video model, so `video-generate` stays unset
# until a video-capable provider is registered and the knob is set.
bundled:
  # Tenant the defaults are seeded for. `"*"` (default) seeds EVERY tenant.
  seedTenant: "*"
  model:
    text: "gateway-text/tal-coding/deepseek-v4.1-flash"
    image: "gateway-image/tal-coding-gptimage/gpt-image-2.5-flare"
    imageEdit: "gateway-image/tal-coding-gptimage/gpt-image-2.5-flare"
    speech: "gateway-speech/mlops-tts-customvoice/qwen3-tts-customvoice"
    speechClone: "gateway-speech/mlops-tts-base/qwen3-tts-base"
    transcription: "gateway-transcription/mlops-asr/qwen3-asr"

# ---- fixed easyworker sandbox (worker-extension backend) ----
worker:
  enabled: true
  image:
    repository: git.agent.svc.cluster.local/abcp/agent-worker
    tag: "20260924170523"
    pullPolicy: IfNotPresent
  service:
    name: worker
    type: ClusterIP
  # Container port the worker listens on (the easyworker convention); the
  # Service exposes 80 -> this so `worker-url` uses the plain :80 address.
  port: 48080
  # Empty = the worker's own default (~/workspace, i.e. /root/workspace in the
  # container). Set an explicit path to pin the workspace root.
  workspace: ""
  # Bearer the worker requires; the extension is seeded with the SAME token.
  token: "devworker-token"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }

# ---- worker extension (run commands / read-write files AND drive a GUI via
#      accessibility in the SAME config-registered sandboxes) ----
# One `sandboxes` list feeds both the worker-* (exec/files) and computer-*
# (GUI) tools. `seedTenant: "*"` fans the list out to every known tenant.
workerExtension:
  enabled: true
  image:
    repository: git.agent.svc.cluster.local/abcp/worker-extension
    tag: "20260928130000"
    pullPolicy: IfNotPresent
  # Tenant the sandboxes list is seeded for. `"*"` = every tenant.
  seedTenant: "*"
  # JSON list of agent-worker endpoints ({name,url,token}); the first is the
  # default. Empty = a single `default` sandbox built from the in-chart worker.
  sandboxes: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# ---- persistence ----
# With db.backend=pg (the default) the agent needs NO /data volume — the DB
# lives in the shared Postgres — so this is disabled. Enable it only for a
# self-contained sqlite agent: `mode` selects `hostPath` or `pvc`.
persistence:
  enabled: false
  mode: hostPath          # hostPath | pvc
  storageClass: workspace-local
  size: 2Gi
  # hostPath root for /data (single-node dev cluster). DirectoryOrCreate.
  hostPath: /home/develop/.easylab
  subPath: agent-data
  type: DirectoryOrCreate

# ---- RBAC ----
serviceAccount:
  create: true
  name: "abcp-agent"
