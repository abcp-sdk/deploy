{{- $p := include "abcp-agent.prefix" . -}}
{{- if and .Values.persistence.enabled (eq .Values.persistence.mode "pvc") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $p }}agent-data
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
    app: {{ .Values.agent.service.name }}
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: {{ .Values.persistence.storageClass | default "workspace-local" }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "2Gi" }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.agent.service.name }}
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
    app: {{ .Values.agent.service.name }}
spec:
  replicas: {{ .Values.agent.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take the only healthy replica down first (no rollout outage).
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Values.agent.service.name }}
  template:
    metadata:
      labels:
        {{- include "abcp-agent.labels" . | nindent 8 }}
        app: {{ .Values.agent.service.name }}
    spec:
      serviceAccountName: {{ include "abcp-agent.saName" . }}
      securityContext: {}
      containers:
        # ---- abcp agent (session/model/turn engine; h2c only) ----
        - name: agent
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: NATS_URL
              value: {{ include "abcp-agent.natsUrl" . | quote }}
            {{- if eq .Values.agent.db.backend "pg" }}
            - name: DB_BACKEND
              value: pg
            - name: POSTGRES_HOST
              value: {{ .Values.agent.db.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.agent.db.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.agent.db.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.agent.db.postgres.password | quote }}
            - name: POSTGRES_DB_AGENT
              value: {{ .Values.agent.db.postgres.database | quote }}
            {{- else }}
            - name: DB_BACKEND
              value: sqlite
            - name: DATABASE_URL
              value: sqlite:///data/agent.db
            {{- end }}
            - name: PORT
              value: {{ .Values.agent.port | quote }}
            # Plain HTTP/1.1 liveness/readiness port (kubelet probes cannot
            # speak the h2c RPC port). Readiness fails when the bus is dead.
            - name: AGENT_HEALTH_PORT
              value: {{ .Values.agent.healthPort | quote }}
            # h2c: in-cluster clients (extensions, gateways, the Caddy
            # aggregator) speak cleartext HTTP/2 prior-knowledge.
            - name: HTTP_PROTOCOL
              value: h2c
            - name: AGENT_CORS_ORIGIN
              value: {{ .Values.agent.corsOrigin | quote }}
            - name: AGENT_AUTH_MODE
              value: "required"
            - name: AGENT_ADMIN_TOKEN
              value: {{ .Values.agent.auth.adminToken | quote }}
            - name: AGENT_BOOTSTRAP_TENANT
              value: {{ .Values.agent.auth.bootstrapTenant | quote }}
            - name: AGENT_BOOTSTRAP_TOKEN
              value: {{ .Values.agent.auth.bootstrapToken | quote }}
            {{- if .Values.agent.disabledTools }}
            - name: DISABLED_TOOLS
              value: {{ .Values.agent.disabledTools | quote }}
            {{- end }}
            # Idle-turn watchdog: re-trigger a session that stopped mid-task
            # after a tool call. Opt-in (default off).
            - name: IDLEWATCH_ENABLED
              value: {{ .Values.agent.idlewatch.enabled | quote }}
            - name: IDLEWATCH_INTERVAL
              value: {{ .Values.agent.idlewatch.interval | quote }}
            # Recover turns killed mid-flight (SIGTERM/OOM/restart) at boot
            # instead of waiting for the first idlewatch sweep.
            - name: RESUME_DANGLING_ON_BOOT
              value: {{ .Values.agent.idlewatch.resumeDanglingOnBoot | quote }}
            # Seed deployment-pinned extension config into the `cfg` KV
            # (create-if-absent; a UI-set value always wins) so the tools work
            # out of the box. `tenant: "*"` fans out to every known tenant.
            {{- if or .Values.playwright.enabled .Values.workerExtension.enabled .Values.bundled.seedTenant }}
            - name: AGENT_EXT_CONFIG_SEED
              value: {{ list
                (dict "tenant" .Values.playwright.seedTenant "extId" "playwright" "name" "selenium-url" "value" (include "abcp-agent.seleniumUrl" .))
                (dict "tenant" .Values.workerExtension.seedTenant "extId" "worker" "name" "sandboxes" "value" (include "abcp-agent.workerSandboxes" .))
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.text" "value" .Values.bundled.model.text)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.image" "value" .Values.bundled.model.image)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.image_edit" "value" .Values.bundled.model.imageEdit)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.speech" "value" .Values.bundled.model.speech)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.speech_clone" "value" .Values.bundled.model.speechClone)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.transcription" "value" .Values.bundled.model.transcription)
                | toJson | quote }}
            {{- end }}
            {{- if .Values.providers }}
            # Seed the model registry into any tenant that has NO providers yet
            # (create-if-absent; a tenant with providers is left untouched, so a
            # UI edit always wins). This gives a fresh standalone deployment a
            # working model registry without a UI round-trip.
            - name: AGENT_PROVIDER_SEED
              value: {{ include "abcp-agent.providersSeed" . | quote }}
            {{- end }}
            {{- if .Values.agent.defaultModel }}
            # Pin the tenant `default_model` (create-if-absent) so a NEW session
            # has a working model on its FIRST turn. Without it a fresh session
            # errors with `no model selected` until one is chosen in the UI.
            # Requires an agent image that supports AGENT_CONFIG_SEED.
            - name: AGENT_CONFIG_SEED
              value: {{ list (dict "tenant" .Values.bundled.seedTenant "key" "default_model" "value" .Values.agent.defaultModel) | toJson | quote }}
            {{- end }}
            {{- include "abcp-agent.objectStoreEnv" . | nindent 12 }}
            {{- include "abcp-agent.egressProxyEnv" . | nindent 12 }}
          ports:
            - { containerPort: {{ .Values.agent.port }}, protocol: TCP }
            {{- if gt (int .Values.agent.healthPort) 0 }}
            - { containerPort: {{ .Values.agent.healthPort }}, protocol: TCP, name: health }
            {{- end }}
          {{- if gt (int .Values.agent.healthPort) 0 }}
          # Liveness: the process is up. Readiness: the bus is live AND the
          # server finished wiring; a zombie whose NATS connection died fails
          # readiness (and, with the exit-on-close supervisor, restarts).
          # The agent is a SINGLE Node process running many concurrent turns
          # against a synchronous sqlite driver; under load the event loop can
          # briefly starve the health listener. A 1s probe timeout caused false
          # kills (and cancelled in-flight turns), so allow a generous timeout.
          livenessProbe:
            httpGet: { path: /health, port: health }
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          {{- if and .Values.persistence.enabled (ne .Values.agent.db.backend "pg") }}
          volumeMounts:
            - { mountPath: /data, name: data, subPath: {{ .Values.persistence.subPath }} }
          {{- end }}
      {{- if and .Values.persistence.enabled (ne .Values.agent.db.backend "pg") }}
      volumes:
        - name: data
          {{- if eq .Values.persistence.mode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ $p }}agent-data
          {{- else }}
          hostPath:
            path: {{ .Values.persistence.hostPath }}
            type: {{ .Values.persistence.type }}
          {{- end }}
      {{- end }}
{{- if gt (int (.Values.agent.replicas | default 1)) 1 }}
---
# Keep at least one replica available during voluntary disruptions (node drain,
# rollout).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.agent.service.name }}
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
    app: {{ .Values.agent.service.name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Values.agent.service.name }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.agent.service.name }}
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.agent.service.type }}
  selector:
    app: {{ .Values.agent.service.name }}
  ports:
    - name: h2c
      port: 80
      targetPort: {{ .Values.agent.port }}
      # Signal to an L7 proxy/ingress that this backend speaks cleartext
      # HTTP/2 (h2c), so it must NOT downgrade the upstream to HTTP/1.1.
      appProtocol: kubernetes.io/h2c
